name: Build and release WinVora

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix (for example 0.8.3)
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Verify project version
        shell: pwsh
        run: .\scripts\Validate-Release.ps1 -ExpectedVersion "${{ steps.version.outputs.value }}"

      - name: Run automated tests
        run: dotnet test Tests\WinVora.Tests.csproj -c Release -p:Platform=x64

      - name: Publish
        run: dotnet publish WinVora.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o publish

      - name: Sign application when a certificate is configured
        shell: pwsh
        env:
          WINVORA_SIGNING_PFX_BASE64: ${{ secrets.WINVORA_SIGNING_PFX_BASE64 }}
          WINVORA_SIGNING_PFX_PASSWORD: ${{ secrets.WINVORA_SIGNING_PFX_PASSWORD }}
        run: .\scripts\Sign-Artifact.ps1 -Path .\publish\WinVora.exe

      - name: Validate self-contained publish
        shell: pwsh
        run: .\scripts\Test-PublishReadiness.ps1 -PublishDirectory .\publish

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress --yes
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $compiler = $command.Source }
          }
          if (-not $compiler) {
            $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler was not found." }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: '& $env:INNO_COMPILER Packaging\WinVoraSetup.iss'

      - name: Sign installer when a certificate is configured
        shell: pwsh
        env:
          WINVORA_SIGNING_PFX_BASE64: ${{ secrets.WINVORA_SIGNING_PFX_BASE64 }}
          WINVORA_SIGNING_PFX_PASSWORD: ${{ secrets.WINVORA_SIGNING_PFX_PASSWORD }}
        run: .\scripts\Sign-Artifact.ps1 -Path "installer_output\WinVora-Setup-${{ steps.version.outputs.value }}.exe"

      - name: Validate installer artifact
        shell: pwsh
        env:
          WINVORA_SIGNING_PFX_BASE64: ${{ secrets.WINVORA_SIGNING_PFX_BASE64 }}
        run: |
          $installer = "installer_output\WinVora-Setup-${{ steps.version.outputs.value }}.exe"
          $requireSignature = "${{ env.WINVORA_SIGNING_PFX_BASE64 }}" -ne ""
          .\scripts\Test-PublishReadiness.ps1 -PublishDirectory .\publish -InstallerPath $installer -RequireSignature:$requireSignature

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "installer_output\WinVora-Setup-${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content "installer_output\SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WinVora-${{ steps.version.outputs.value }}
          path: |
            installer_output/WinVora-Setup-${{ steps.version.outputs.value }}.exe
            installer_output/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: WinVora-*
          path: release-assets
          merge-multiple: true

      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            release-assets/WinVora-Setup-*.exe
            release-assets/SHA256SUMS.txt
